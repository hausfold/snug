name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Let a branch be checked on demand (e.g. before opening a PR) without
  # having to push to main first.
  workflow_dispatch:

# A second push to a PR branch makes the first run's answer worthless, and the
# abandoned run still holds a runner — on the macOS ones, a queue slot the next
# PR then waits behind.
#
# Only a PR run is ever in a shared group. Everything else keys on the commit,
# so it gets a group of its own: putting main pushes in one group would
# SERIALIZE them even with cancelling off, and GitHub cancels a *pending* run
# when a newer one joins its group — so three merges inside one build would
# leave the middle commit with no run at all. That is the tick this is
# supposed to protect.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # gofmt first: a formatting failure after a ten-minute test run is a
      # ten-minute wait for a one-character fix.
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # The width sweeps are the point of this suite and they are fast; -race
      # because Region takes a SIGWINCH on another goroutine while the paint
      # loop holds the lock.
      - run: go test -race -timeout 120s ./...

  # share/ui.sh is bash, so the Go job above never looks at it — and it is the
  # painter every family CLI falls back to on a machine that cannot see
  # `bin/snug`, which makes it the half most likely to break unwatched. Same
  # treatment the Go half gets: a linter and the width sweeps.
  #
  # Ubuntu only, and `bats` runs the tests under `$BASH` rather than `bash` on
  # purpose: the library needs bash 4 (associative arrays, `${v,,}`) and macOS
  # ships 3.2 as /bin/bash, so a macos-latest runner would fail on the array
  # instead of on the thing under test. The library's own bash-4 requirement is
  # stated in its header; nothing here is testing that macOS's bash is old.
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck is on the ubuntu-latest image already, and bats comes from
      # npm rather than apt: `apt-get update` bought one of the two tools and,
      # on the day the Azure mirrors go quiet, hangs rather than fails.
      - run: sudo npm install -g bats
      - run: shellcheck --version && shellcheck share/ui.sh
      # The palette drift test used to need a second checkout beside this one
      # and skipped — green, checking nothing — without it. Both halves are in
      # this repo now, so it always runs.
      - run: bats test/ui.bats

  # The Go job above cannot see a stale `vendorHash`: it never builds the
  # derivation. Without this, a `go.mod`/`go.sum` change lands green here and
  # first fails inside `haus`, one lock ripple and a rebuild away from its
  # cause. It is also the only thing that ever evaluates `overlays.default`.
  # Linux only — the derivation is platform-independent and a second runner
  # buys nothing but minutes.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The installer is the only lever left on this job. A store cache was
      # measured here and refused — 3-4s of restorable download against a 17s
      # restore at the family's cheapest, workshop `docs/ci.md` § The Nix store
      # cache — which leaves the install, 6.9s of a 41s job and the longest job
      # in this run.
      #
      # quick-install unpacks an upstream Nix tarball into a single-user /nix
      # instead of running an installer that configures a daemon, and lands in
      # 0.8s here: the same second haus and nebelung have been paying.
      #
      # It is NOT the same Nix, and the difference was read off a run rather
      # than assumed (34948548370, this branch before the PR): upstream 2.34.7
      # against `nix-installer-action@v23`'s Determinate Nix, no daemon, and
      # `build-users-group` empty so the builder is `runner` itself. Both
      # things these two steps need are there — `experimental-features =
      # fetch-tree flakes nix-command`, which the action writes for any nix
      # past 2.13, and `sandbox = true`, which single-user mode keeps because
      # the runner allows unprivileged user namespaces. A future runner image
      # that takes those away is the one thing that would make this a downgrade
      # rather than six seconds: it would show up as a build escaping the
      # sandbox, not as a red step.
      #
      # ⚠️ `sandbox = true` above is a LINUX default and not a property of
      # this installer. Off Linux nix defaults it to FALSE and neither
      # installer writes the line at all, which is what pounce found when it
      # took this same action to macos-15 (hausfold/pounce#142 — 5.1s against
      # Determinate's 68.2s, paired over eight runs, same derivation hash).
      # The reason this comment used to give for leaving pounce alone, that
      # Determinate relaxes a macOS build sandbox, was never true. Nothing in
      # the family's gate installs Determinate now; workshop `docs/ci.md` §
      # The Nix installer carries both platforms' numbers.
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build .#default --print-build-logs
      - run: nix flake check --print-build-logs
