# Generated by workshop/script/issue-templates.sh — edit the generator, not this.
name: Bug report
description: A CLI drew something wrong in your terminal
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Wrong repo? File it anyway.** hausfold is one product split across
        eight repositories, and working out which one owns your bug is our job,
        not yours — we move issues between them in one click.

        There's no telemetry in any of this, ever. This form is the only way we
        find out.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: |
        What you did, what you expected, and what you got instead. Verbatim
        beats tidy — "it said something about a lock file" is worth more
        polished than nothing.
      placeholder: |
        I …
        I expected …
        Instead …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where in snug?
      description: A guess is fine. It only routes the first look.
      options:
        - a line wrapped, or ran past the edge
        - a table — columns misaligned or truncated wrong
        - a live region — a spinner or progress that repainted wrong
        - colour — wrong, missing, or unreadable
        - a glyph drew in the wrong number of cells
        - resizing the window
        - the docs
        - somewhere else, or not sure
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: |-
        Your terminal
      description: |-
        Paste the output of `snug caps`. If you haven't got `snug` itself, paste your terminal app and its version, `echo $TERM`, and `stty size` at the width where it went wrong. It only reads — it changes nothing and sends nothing anywhere.
      render: text
    validations:
      required: false
  - type: textarea
    id: anything
    attributes:
      label: Anything else
      description: A screenshot, a log line, a hunch about what caused it. Optional — send the form without it rather than not sending it.
    validations:
      required: false
